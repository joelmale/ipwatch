[package]
name = "ipwatch"
version = "0.1.0"
description = "System-tray monitor for external IP, geolocation, and DNS — verify your VPN is working"
authors = ["Joel Nelson"]
license = "MIT"
repository = "https://github.com/joelmale/ipwatch"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ipwatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
thiserror = "2.0.20"
async-trait = "0.1.92"
local-ip-address = "0.6.13"
gethostname = "1.1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset", "http2", "system-proxy"] }

[target."cfg(windows)".dependencies]
ipconfig = "0.3.4"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full", "test-util"] }
wiremock = "0.6.5"

